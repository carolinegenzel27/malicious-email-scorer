# Keeps the free-tier backend awake.
#
# Render's free plan puts the service to sleep after 15 minutes without
# requests, and waking takes 15-60s - longer than Gmail's ~30s limit for an
# add-on to answer. Pinging the public /health endpoint every 10 minutes keeps
# it awake. The request carries no secrets and no email data.
# On a paid plan (no sleep) this workflow would simply be deleted.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes (GitHub may delay runs a little)
  workflow_dispatch: # allow a manual run, e.g. right before a demo

permissions: {} # needs no access to the repository

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl --fail --silent --show-error --max-time 90 --retry 2 https://malicious-email-scorer-vx4h.onrender.com/health
